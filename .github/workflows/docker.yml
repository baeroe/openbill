name: Docker image

on:
  # release: tag vX.Y.Z → baeroe/openbill:X.Y.Z, :X.Y, :latest (not for pre-releases like v0.2.0-rc.1) + GitHub release
  push:
    tags: ['v*']
  # build-only check of both platforms (nothing is pushed) when the inputs of the image change
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - composer.lock
      - pnpm-lock.yaml
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      # every tag needs a section in docs/en/upgrading.md and docs/de/upgrading.md: checked before anything is pushed
      - name: Release notes
        if: env.RELEASE == 'true'
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # actions that see the Docker Hub token are pinned by commit
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.RELEASE == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: baeroe/openbill
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.RELEASE == 'true' && !contains(github.ref_name, '-') }}
            type=ref,event=pr

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

  # the only job that may write to the repository, and only for tags
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # the notes from docs/en/upgrading.md come first, GitHub's generated list of changes after them
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$(scripts/release-notes.sh "${GITHUB_REF_NAME#v}")" $prerelease
