name: Docs

# GitHub Pages with the custom domain https://openbill.dev (set in the repository's Pages settings; with a custom
# workflow no CNAME file is needed). The site lives at the root (base /).
on:
  push:
    branches: [main]
    paths: ['docs/**', 'docker-compose.yml', 'docker-compose.standalone.yml', 'pnpm-lock.yaml', '.github/workflows/docs.yml'] # the compose files are embedded in the docs
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a running one is not cancelled halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_URL: https://openbill.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" needs the git history

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir docs build

      # no actions/configure-pages: its outputs (base_url …) are not used, the base is the default /, and it would
      # need pages: read in this job
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
