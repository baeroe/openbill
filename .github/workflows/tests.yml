name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # required check: the name must stay `tests`
  tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testing
          MARIADB_USER: db
          MARIADB_PASSWORD: db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3000:3000

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: db
      DB_PASSWORD: db
      GOTENBERG_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, bcmath, gd, pdo_mysql
          coverage: none

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Environment
        run: cp .env.example .env && php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Gotenberg reachable
        run: curl -fsS --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:3000/health

      - name: Pest
        run: php artisan test

      # domain logic of the clickable prototypes (sums, taxes, numbering, chain, Liquid, page breaks)
      - name: Prototypes
        run: |
          pnpm --filter "./prototypes/*" run typecheck
          pnpm --filter "./prototypes/*" run test
          pnpm --filter "./prototypes/*" run build

      - name: Docs
        run: pnpm --dir docs build
