name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # required check: the name must stay `tests`
  tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4.13@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testing
          MARIADB_USER: db
          MARIADB_PASSWORD: db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: db
      DB_PASSWORD: db
      GOTENBERG_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      # not a service container: services can't take a command, and Gotenberg must run hardened
      # (no JavaScript, no URLs but its own files and data:) – same image and flags as docker-compose.yml and
      # .ddev/docker-compose.gotenberg.yaml (DockerSetupTest)
      - name: Gotenberg
        run: >-
          docker run -d --name gotenberg -p 3000:3000 gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769 gotenberg
          --chromium-disable-javascript=true
          '--chromium-deny-list=^file:(?!//\/tmp/).*'
          '--chromium-deny-list=^(?!(file|data):).*'
          --chromium-deny-private-ips=true
          --chromium-deny-public-ips=true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, bcmath, gd, pdo_mysql
          coverage: none

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Environment
        run: cp .env.example .env && php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      # unit tests of resources/js (lib/api.ts, formatting, keys, navigation)
      - name: Vitest
        run: pnpm test

      # workspace packages (paged-preview: page geometry and breaks)
      - name: Packages
        run: |
          pnpm --filter "./packages/*" run typecheck
          pnpm --filter "./packages/*" run test

      - name: Build
        run: pnpm build

      - name: Gotenberg reachable
        run: curl -fsS --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:3000/health

      - name: Pest
        run: php artisan test
        env:
          # EInvoiceSamplesTest writes the archived e-invoice XMLs there for the einvoice job
          EINVOICE_SAMPLES_DIR: ${{ github.workspace }}/einvoice-samples

      - uses: actions/upload-artifact@v4
        with:
          name: einvoice-samples
          path: einvoice-samples/*.xml
          if-no-files-found: error

      # domain logic of the clickable prototypes (sums, taxes, numbering, chain, Liquid, page breaks)
      - name: Prototypes
        run: |
          pnpm --filter "./prototypes/*" run typecheck
          pnpm --filter "./prototypes/*" run test
          pnpm --filter "./prototypes/*" run build

      # built like docs.yml publishes it (GitHub Pages under /openbill/): links, assets and the favicon carry the base
      - name: Docs
        run: |
          pnpm --dir docs build
          grep -q 'href="/openbill/favicon.svg"' docs/.vitepress/dist/en/index.html
          grep -q 'https://baeroe.github.io/openbill/setup.md' docs/.vitepress/dist/llms.txt
        env:
          DOCS_BASE: /openbill/
          DOCS_URL: https://baeroe.github.io/openbill

  # EN 16931 business rules on the e-invoices the tests archive: the official CEN CII Schematron (Saxon-HE) and the
  # KoSIT validator (scenario "EN16931 (CII)" of its XRechnung configuration). Not a required check; see
  # scripts/validate-einvoice.sh.
  einvoice:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: einvoice-samples
          path: einvoice-samples

      # Schematron, Saxon-HE, xmlresolver, KoSIT validator and configuration: downloaded once per version of the script
      # (it pins URLs and SHA-256), so a flaky download source only hurts the first run after a version bump
      - uses: actions/cache@v4
        with:
          path: storage/framework/testing/einvoice-validator
          key: einvoice-validator-${{ hashFiles('scripts/validate-einvoice.sh') }}

      - name: EN 16931 Schematron and KoSIT
        run: scripts/validate-einvoice.sh einvoice-samples

  # Playwright against the Compose stack built from this commit: production image, MariaDB, hardened Gotenberg,
  # APP_ENV=e2e only so the seeders run (e2e/docker-compose.e2e.yml). Not a required check.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBILL_URL: http://localhost:7739
      E2E_ARTISAN: e2e/compose.sh exec -T openbill php artisan
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: openbill:e2e
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,scope=e2e,mode=max

      - name: Compose stack
        run: e2e/compose.sh up -d --wait --wait-timeout 300

      # version comes from "packageManager" in package.json (same as e2e/package.json)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Playwright
        run: |
          pnpm --dir e2e install --frozen-lockfile
          pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Tests
        run: pnpm --dir e2e test

      - name: Compose logs
        if: failure()
        run: e2e/compose.sh logs --no-color --timestamps > compose.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            compose.log
            e2e/test-results
          if-no-files-found: ignore

      - name: Stop
        if: always()
        run: e2e/compose.sh down -v
