name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clickdummy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version-file: clickdummy/.node-version
          cache: pnpm
          cache-dependency-path: clickdummy/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Fachlogik: Summen, Steuern, Nummernkreise, Dokumentkette, Liquid-Rendering, Seitenumbruch
      - run: pnpm test
      - run: pnpm build
