name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version-file: clickdummy-v2/.node-version
          cache: pnpm
          cache-dependency-path: |
            clickdummy/pnpm-lock.yaml
            clickdummy-v2/pnpm-lock.yaml
      # Fachlogik: Summen, Steuern, Nummernkreise, Dokumentkette, Liquid-Rendering, Seitenumbruch
      - name: clickdummy
        working-directory: clickdummy
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: clickdummy-v2
        working-directory: clickdummy-v2
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
